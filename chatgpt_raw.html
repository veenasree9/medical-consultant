(() => {
  const key = "oai-epic-native-launch";
  let launch = null;
  try { launch = JSON.parse(sessionStorage.getItem(key) || "null"); } catch {}
  function save() {
    try {
      if (launch) sessionStorage.setItem(key, JSON.stringify(launch));
      else sessionStorage.removeItem(key);
    } catch { launch = null; }
  }
  function capture() {
    const fragment = window.location.hash;
    if (!fragment) return;
    window.history.replaceState(window.history.state, "", "/epic/launch");
    const params = new URLSearchParams(fragment.slice(1));
    const snapshot = params.get("snapshot");
    const workspace = params.get("workspace_id");
    launch = Array.from(params).length === (workspace ? 2 : 1) && (!workspace || /^[A-Za-z0-9_-]{1,128}$/.test(workspace)) && snapshot &&
      /^[A-Za-z0-9_-]{80,16384}={0,2}$/.test(snapshot)
      ? { snapshot, workspace, id: crypto.randomUUID(), messageId: null, draftId: null } : null;
    save();
  }
  if (window.location.pathname === "/epic/launch") capture();
  function pending() {
    return launch && !launch.draftId && new URLSearchParams(window.location.search).get("epic_launch") === launch.id
      ? launch.snapshot : null;
  }
  window.__oaiEpicNativeLaunch = {
    get: () => launch?.snapshot ?? null,
    workspace: () => launch?.workspace ?? null,
    destination: () => launch ? "/?surface=work&epic_launch=" + launch.id : "/epic/launch",
    pending,
    ownsMessage: (messageId) => launch?.messageId === messageId,
    metadata: (messageId, draftId) => {
      if (!launch) return;
      if (draftId != null) {
        if (launch.draftId ? launch.draftId !== draftId : !pending()) return;
        launch.draftId = draftId;
      } else if (launch.messageId !== messageId) return;
      const changed = launch.messageId !== messageId;
      launch.messageId = messageId;
      save();
      if (changed) window.dispatchEvent(new Event("oai-epic-launch-changed"));
      return launch ? { epic_launch_snapshot: launch.snapshot } : undefined;
    },
    clear: (expected) => {
      if (launch?.snapshot === expected || launch?.messageId === expected) {
        launch = null;
        save();
        window.dispatchEvent(new Event("oai-epic-launch-changed"));
      }
    }
  };
  window.addEventListener("hashchange", () => {
    if (window.location.pathname !== "/epic/launch" || !window.location.hash) return;
    capture();
    window.dispatchEvent(new Event("oai-epic-launch-changed"));

s, health dashboard updates, medication tracker functions, mood selection logic, and navigation between the app sections as described in the frontend prototype.\",\"stop\",\"stop_tokens\",[202],200002,\"content_type\",\"parts\",[206],\"Yes 👍 Below is a **working frontend prototype** for your health AI chatbot. It includes chat UI, emotion-aware replies, symptom analysis, file upload/preview, health dashboard, medication tracker, and Telugu/English support.\\n\\n**Important:** this frontend does not diagnose diseases or prescribe medicines. The “medicine” section is intentionally limited to medication information/reminders and doctor/pharmacist confirmation.\\n\\nCreate these 3 files:\\n\\n```text\\nmedimind-ai/\\n├── index.html\\n├── style.css\\n└── script.js\\n```\\n\\n### 1. `index.html`\\n\\n```html\\n\u003c!DOCTYPE html\u003e\\n\u003chtml lang=\\\"en\\\"\u003e\\n\u003chead\u003e\\n  \u003cmeta charset=\\\"UTF-8\\\"\u003e\\n  \u003cmeta name=\\\"viewport\\\" content=\\\"width=device-width, initial-scale=1.0\\\"\u003e\\n\\n  \u003ctitle\u003eMediMind AI - Health Assistant\u003c/title\u003e\\n\\n  \u003clink rel=\\\"stylesheet\\\" href=\\\"style.css\\\"\u003e\\n\\n  \u003clink rel=\\\"preconnect\\\" href=\\\"https://fonts.googleapis.com\\\"\u003e\\n  \u003clink rel=\\\"preconnect\\\" href=\\\"https://fonts.gstatic.com\\\" crossorigin\u003e\\n  \u003clink href=\\\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800\u0026display=swap\\\" rel=\\\"stylesheet\\\"\u003e\\n\u003c/head\u003e\\n\\n\u003cbody\u003e\\n\\n\u003cdiv class=\\\"app\\\"\u003e\\n\\n  \u003c!-- SIDEBAR --\u003e\\n  \u003caside class=\\\"sidebar\\\"\u003e\\n\\n    \u003cdiv class=\\\"logo\\\"\u003e\\n      \u003cdiv class=\\\"logo-icon\\\"\u003e✚\u003c/div\u003e\\n      \u003cdiv\u003e\\n        \u003ch2\u003eMediMind\u003c/h2\u003e\\n        \u003cspan\u003eAI Health Assistant\u003c/span\u003e\\n      \u003c/div\u003e\\n    \u003c/div\u003e\\n\\n    \u003cbutton class=\\\"new-chat\\\" onclick=\\\"newChat()\\\"\u003e\\n      ＋ New conversation\\n    \u003c/button\u003e\\n\\n    \u003cnav\u003e\\n      \u003cbutton class=\\\"nav-item active\\\" onclick=\\\"showSection('chat')\\\"\u003e\\n        💬 \u003cspan\u003eAI Chat\u003c/span\u003e\\n      \u003c/button\u003e\\n\\n      \u003cbutton class=\\\"nav-item\\\" onclick=\\\"showSection('reports')\\\"\u003e\\n        📄 \u003cspan\u003eReports\u003c/span\u003e\\n      \u003c/button\u003e\\n\\n      \u003cbutton class=\\\"nav-item\\\" onclick=\\\"showSection('dashboard')\\\"\u003e\\n        📊 \u003cspan\u003eHealth Dashboard\u003c/span\u003e\\n      \u003c/button\u003e\\n\\n      \u003cbutton class=\\\"nav-item\\\" onclick=\\\"showSection('medications')\\\"\u003e\\n        💊 \u003cspan\u003eMedications\u003c/span\u003e\\n      \u003c/button\u003e\\n\\n      \u003cbutton class=\\\"nav-item\\\" onclick=\\\"showSection('mood')\\\"\u003e\\n        ❤️ \u003cspan\u003eMood \u0026 Symptoms\u003c/span\u003e\\n      \u003c/button\u003e\\n    \u003c/nav\u003e\\n\\n    \u003cdiv class=\\\"privacy\\\"\u003e\\n      \u003cdiv\u003e🔐\u003c/div\u003e\\n      \u003cdiv\u003e\\n        \u003cstrong\u003ePrivacy first\u003c/strong\u003e\\n        \u003cp\u003eYour health data should be handled securely.\u003c/p\u003e\\n      \u003c/div\u003e\\n    \u003c/div\u003e\\n\\n  \u003c/aside\u003e\\n\\n\\n  \u003c!-- MAIN --\u003e\\n  \u003cmain class=\\\"main\\\"\u003e\\n\\n    \u003c!-- TOP BAR --\u003e\\n    \u003cheader class=\\\"topbar\\\"\u003e\\n\\n      \u003cdiv\u003e\\n        \u003ch1 id=\\\"pageTitle\\\"\u003eAI Health Assistant\u003c/h1\u003e\\n        \u003cp id=\\\"pageSubtitle\\\"\u003eTell me what you're experiencing.\u003c/p\u003e\\n      \u003c/div\u003e\\n\\n      \u003cdiv class=\\\"status\\\"\u003e\\n        \u003cspan class=\\\"status-dot\\\"\u003e\u003c/span\u003e\\n        AI Online\\n      \u003c/div\u003e\\n\\n    \u003c/header\u003e\\n\\n\\n    \u003c!-- CHAT SECTION --\u003e\\n    \u003csection id=\\\"chat\\\" class=\\\"section active\\\"\u003e\\n\\n      \u003cdiv class=\\\"chat-layout\\\"\u003e\\n\\n        \u003cdiv class=\\\"chat-card\\\"\u003e\\n\\n          \u003cdiv id=\\\"messages\\\" class=\\\"messages\\\"\u003e\\n\\n            \u003cdiv class=\\\"message ai\\\"\u003e\\n\\n              \u003cdiv class=\\\"avatar\\\"\u003e✚\u003c/div\u003e\\n\\n              \u003cdiv class=\\\"bubble\\\"\u003e\\n\\n                \u003cstrong\u003eMediMind AI\u003c/strong\u003e\\n\\n                \u003cp\u003e\\n                  Hi! I'm MediMind, your health information assistant.\\n                  Tell me about your symptoms or upload a health report.\\n                \u003c/p\u003e\\n\\n                \u003cdiv class=\\\"warning\\\"\u003e\\n                  ⚠️ I provide health information, not a medical diagnosis\\n                  or prescription.\\n                \u003c/div\u003e\\n\\n              \u003c/div\u003e\\n\\n            \u003c/div\u003e\\n\\n          \u003c/div\u003e\\n\\n\\n          \u003c!-- QUICK ACTIONS --\u003e\\n          \u003cdiv class=\\\"quick-actions\\\"\u003e\\n\\n            \u003cbutton onclick=\\\"quickMessage('I have fever and headache')\\\"\u003e\\n              🌡️ Fever\\n            \u003c/button\u003e\\n\\n            \u003cbutton onclick=\\\"quickMessage('I have stomach pain')\\\"\u003e\\n              🤕 Pain\\n            \u003c/button\u003e\\n\\n            \u003cbutton onclick=\\\"quickMessage('I am feeling anxious')\\\"\u003e\\n              ❤️ Emotional support\\n            \u003c/button\u003e\\n\\n            \u003cbutton onclick=\\\"showSection('reports')\\\"\u003e\\n              📄 Analyze report\\n            \u003c/button\u003e\\n\\n          \u003c/div\u003e\\n\\n\\n          \u003c!-- INPUT --\u003e\\n          \u003cdiv class=\\\"input-area\\\"\u003e\\n\\n            \u003clabel class=\\\"upload-btn\\\"\u003e\\n\\n              📎\\n\\n              \u003cinput\\n                type=\\\"file\\\"\\n                id=\\\"fileInput\\\"\\n                accept=\\\".pdf,.png,.jpg,.jpeg,.txt\\\"\\n                hidden\\n                onchange=\\\"handleFile(event)\\\"\\n              \u003e\\n\\n            \u003c/label\u003e\\n\\n            \u003ctextarea\\n              id=\\\"userInput\\\"\\n              placeholder=\\\"Describe your symptoms...\\\"\\n              rows=\\\"1\\\"\\n              onkeydown=\\\"handleEnter(event)\\\"\\n            \u003e\u003c/textarea\u003e\\n\\n            \u003cbutton class=\\\"send-btn\\\" onclick=\\\"sendMessage()\\\"\u003e\\n              ➤\\n            \u003c/button\u003e\\n\\n          \u003c/div\u003e\\n\\n          \u003cdiv id=\\\"fileStatus\\\"\u003e\u003c/div\u003e\\n\\n        \u003c/div\u003e\\n\\n\\n        \u003c!-- RIGHT PANEL --\u003e\\n        \u003caside class=\\\"right-panel\\\"\u003e\\n\\n          \u003cdiv class=\\\"card\\\"\u003e\\n\\n            \u003ch3\u003e🩺 Today's health\u003c/h3\u003e\\n\\n            \u003cdiv class=\\\"health-score\\\"\u003e\\n              \u003cdiv class=\\\"score-circle\\\"\u003e\\n                \u003cspan\u003e78\u003c/span\u003e\\n              \u003c/div\u003e\\n\\n              \u003cdiv\u003e\\n                \u003cstrong\u003eGood\u003c/strong\u003e\\n                \u003cp\u003eBased on your tracked data\u003c/p\u003e\\n              \u003c/div\u003e\\n            \u003c/div\u003e\\n\\n          \u003c/div\u003e\\n\\n\\n          \u003cdiv class=\\\"card\\\"\u003e\\n\\n            \u003ch3\u003e🚨 Safety check\u003c/h3\u003e\\n\\n            \u003cp class=\\\"small\\\"\u003e\\n              If you have severe symptoms or an emergency,\\n              seek immediate medical help.\\n            \u003c/p\u003e\\n\\n            \u003cbutton class=\\\"emergency-btn\\\" onclick=\\\"emergencyHelp()\\\"\u003e\\n              Emergency guidance\\n            \u003c/button\u003e\\n\\n          \u003c/div\u003e\\n\\n\\n          \u003cdiv class=\\\"card\\\"\u003e\\n\\n            \u003ch3\u003e💡 Suggested\u003c/h3\u003e\\n\\n            \u003cbutton class=\\\"suggestion\\\" onclick=\\\"quickMessage('Explain my symptoms')\\\"\u003e\\n              Explain my symptoms\\n            \u003c/button\u003e\\n\\n            \u003cbutton class=\\\"suggestion\\\" onclick=\\\"showSection('reports')\\\"\u003e\\n              Analyze a report\\n            \u003c/button\u003e\\n\\n            \u003cbutton class=\\\"suggestion\\\" onclick=\\\"showSection('mood')\\\"\u003e\\n              Track my mood\\n            \u003c/button\u003e\\n\\n          \u003c/div\u003e\\n\\n        \u003c/aside\u003e\\n\\n      \u003c/div\u003e\\n\\n    \u003c/section\u003e\\n\\n\\n    \u003c!-- REPORTS --\u003e\\n    \u003csection id=\\\"reports\\\" class=\\\"section\\\"\u003e\\n\\n      \u003cdiv class=\\\"page-card\\\"\u003e\\n\\n        \u003cdiv class=\\\"section-heading\\\"\u003e\\n\\n          \u003cdiv\u003e\\n            \u003ch2\u003e📄 Health Report Analyzer\u003c/h2\u003e\\n\\n            \u003cp\u003e\\n              Upload a PDF, image or text report for\\n              structured health-information extraction.\\n            \u003c/p\u003e\\n          \u003c/div\u003e\\n\\n          \u003clabel class=\\\"primary-btn\\\"\u003e\\n\\n            Upload Report\\n\\n            \u003cinput\\n              type=\\\"file\\\"\\n              accept=\\\".pdf,.png,.jpg,.jpeg,.txt\\\"\\n              hidden\\n              onchange=\\\"analyzeReport(event)\\\"\\n            \u003e\\n\\n          \u003c/label\u003e\\n\\n        \u003c/div\u003e\\n\\n\\n        \u003cdiv id=\\\"reportResult\\\" class=\\\"report-result\\\"\u003e\\n\\n          \u003cdiv class=\\\"empty-state\\\"\u003e\\n            \u003cdiv\u003e📑\u003c/div\u003e\\n            \u003ch3\u003eNo report uploaded\u003c/h3\u003e\\n            \u003cp\u003e\\n              Upload a laboratory report to see extracted values,\\n              reference ranges and questions to discuss with a clinician.\\n            \u003c/p\u003e\\n          \u003c/div\u003e\\n\\n        \u003c/div\u003e\\n\\n      \u003c/div\u003e\\n\\n    \u003c/section\u003e\\n\\n\\n    \u003c!-- DASHBOARD --\u003e\\n    \u003csection id=\\\"dashboard\\\" class=\\\"section\\\"\u003e\\n\\n      \u003cdiv class=\\\"page-card\\\"\u003e\\n\\n        \u003ch2\u003e📊 Health Dashboard\u003c/h2\u003e\\n\\n        \u003cp\u003eYour tracked health information.\u003c/p\u003e\\n\\n        \u003cdiv class=\\\"stats-grid\\\"\u003e\\n\\n          \u003cdiv class=\\\"stat\\\"\u003e\\n            \u003cspan\u003e❤️ Heart Rate\u003c/span\u003e\\n            \u003cstrong\u003e76 BPM\u003c/strong\u003e\\n          \u003c/div\u003e\\n\\n          \u003cdiv class=\\\"stat\\\"\u003e\\n            \u003cspan\u003e💧 Water\u003c/span\u003e\\n            \u003cstrong\u003e5 / 8 glasses\u003c/strong\u003e\\n          \u003c/div\u003e\\n\\n          \u003cdiv class=\\\"stat\\\"\u003e\\n            \u003cspan\u003e😴 Sleep\u003c/span\u003e\\n            \u003cstrong\u003e7h 20m\u003c/strong\u003e\\n          \u003c/div\u003e\\n\\n          \u003cdiv class=\\\"stat\\\"\u003e\\n            \u003cspan\u003e😊 Mood\u003c/span\u003e\\n            \u003cstrong\u003eGood\u003c/strong\u003e\\n          \u003c/div\u003e\\n\\n        \u003c/div\u003e\\n\\n        \u003cdiv class=\\\"chart\\\"\u003e\\n\\n          \u003ch3\u003eHealth trend\u003c/h3\u003e\\n\\n          \u003cdiv class=\\\"bars\\\"\u003e\\n\\n            \u003cspan style=\\\"height:40%\\\"\u003e\u003c/span\u003e\\n            \u003cspan style=\\\"height:55%\\\"\u003e\u003c/span\u003e\\n            \u003cspan style=\\\"height:48%\\\"\u003e\u003c/span\u003e\\n            \u003cspan style=\\\"height:70%\\\"\u003e\u003c/span\u003e\\n            \u003cspan style=\\\"height:65%\\\"\u003e\u003c/span\u003e\\n            \u003cspan style=\\\"height:80%\\\"\u003e\u003c/span\u003e\\n            \u003cspan style=\\\"height:72%\\\"\u003e\u003c/span\u003e\\n\\n          \u003c/div\u00 ck=\\\"selectMood('😔 Sad')\\\"\u003e😔\u003c/button\u003e\\n\\n        \u003c/div\u003e\\n\\n        \u003cdiv id=\\\"selectedMood\\\" class=\\\"selected-mood\\\"\u003e\\n          Select how you feel today.\\n        \u003c/div\u003e\\n\\n      \u003c/div\u003e\\n\\n    \u003c/section\u003e\\n\\n  \u003c/main\u003e\\n\\n\u003c/div\u003e\\n\\n\u003cscript src=\\\"script.js\\\"\u003e\u003c/script\u003e\\n\\n\u003c/body\u003e\\n\u003c/html\u003e\\n```\\n\\n### 2. `style.css`\\n\\n```css\\n* {\\n  box-sizing: border-box;\\n  margin: 0;\\n  padding: 0;\\n}\\n\\n:root {\\n  --bg: #f5f8fc;\\n  --card: #ffffff;\\n  --primary: #1769ff;\\n  --primary-dark: #0d4dcc;\\n  --text: #172033;\\n  --muted: #718096;\\n  --border: #e5eaf1;\\n  --green: #16a36a;\\n  --danger: #e5484d;\\n}\\n\\nbody {\\n  font-family: \\\"Inter\\\", sans-serif;\\n  background: var(--bg);\\n  color: var(--text);\\n}\\n\\nbutton,\\ninput,\\ntextarea {\\n  font-family: inherit;\\n}\\n\\n\\n/* APP */\\n\\n.app {\\n  display: flex;\\n  min-height: 100vh;\\n}\\n\\n\\n/* SIDEBAR */\\n\\n.sidebar {\\n  width: 260px;\\n  background: #fff;\\n  border-right: 1px solid var(--border);\\n  padding: 25px 18px;\\n  display: flex;\\n  flex-direction: column;\\n}\\n\\n.logo {\\n  display: flex;\\n  align-items: center;\\n  gap: 12px;\\n  margin-bottom: 30px;\\n}\\n\\n.logo-icon {\\n  width: 45px;\\n  height: 45px;\\n  background: var(--primary);\\n  color: white;\\n  border-radius: 13px;\\n  display: flex;\\n  align-items: center;\\n  justify-content: center;\\n  font-size: 23px;\\n  font-weight: bold;\\n}\\n\\n.logo h2 {\\n  font-size: 19px;\\n}\\n\\n.logo span {\\n  font-size: 10px;\\n  color: var(--muted);\\n}\\n\\n.new-chat {\\n  border: none;\\n  background: #edf4ff;\\n  color: var(--primary);\\n  padding: 13px;\\n  border-radius: 10px;\\n  font-weight: 600;\\n  cursor: pointer;\\n  margin-bottom: 20px;\\n}\\n\\nnav {\\n  display: flex;\\n  flex-direction: column;\\n  gap: 6px;\\n}\\n\\n.nav-item {\\n  border: none;\\n  background: transparent;\\n  padding: 13px;\\n  text-align: left;\\n  border-radius: 10px;\\n  cursor: pointer;\\n  color: #526071;\\n  font-size: 14px;\\n}\\n\\n.nav-item:hover,\\n.nav-item.active {\\n  background: #edf4ff;\\n  color: var(--primary);\\n}\\n\\n.privacy {\\n  margin-top: auto;\\n  background: #f4faf7;\\n  padding: 13px;\\n  border-radius: 12px;\\n  display: flex;\\n  gap: 9px;\\n  font-size: 11px;\\n}\\n\\n.privacy p {\\n  color: var(--muted);\\n  margin-top: 4px;\\n}\\n\\n\\n/* MAIN */\\n\\n.main {\\n  flex: 1;\\n  min-width: 0;\\n}\\n\\n.topbar {\\n  height: 82px;\\n  background: white;\\n  border-bottom: 1px solid var(--border);\\n  display: flex;\\n  align-items: center;\\n  justify-content: space-between;\\n  padding: 0 30px;\\n}\\n\\n.topbar h1 {\\n  font-size: 21px;\\n}\\n\\n.topbar p {\\n  font-size: 12px;\\n  color: var(--muted);\\n  margin-top: 5px;\\n}\\n\\n.status {\\n  font-size: 12px;\\n  color: var(--green);\\n  display: flex;\\n  align-items: center;\\n  gap: 6px;\\n}\\n\\n.status-dot {\\n  width: 8px;\\n  height: 8px;\\n  background: var(--green);\\n  border-radius: 50%;\\n}\\n\\n\\n/* SECTIONS */\\n\\n.section {\\n  display: none;\\n  padding: 25px;\\n}\\n\\n.section.active {\\n  display: block;\\n}\\n\\n\\n/* CHAT */\\n\\n.chat-layout {\\n  display: grid;\\n  grid-template-columns: minmax(0, 1fr) 290px;\\n  gap: 20px;\\n}\\n\\n.chat-card {\\n  background: white;\\n  border: 1px solid var(--border);\\n  border-radius: 18px;\\n  min-height: calc(100vh - 132px);\\n  display: flex;\\n  flex-direction: column;\\n}\\n\\n.messages {\\n  flex: 1;\\n  padding: 25px;\\n  overflow-y: auto;\\n}\\n\\n.message {\\n  display: flex;\\n  gap: 12px;\\n  margin-bottom: 20px;\\n}\\n\\n.avatar {\\n  min-width: 37px;\\n  height: 37px;\\n  border-radius: 11px;\\n  background: var(--primary);\\n  color: white;\\n  display: flex;\\n  align-items: center;\\n  justify-content: center;\\n}\\n\\n.message.user {\\n  justify-content: flex-end;\\n}\\n\\n.message.user .avatar {\\n  order: 2;\\n  background: #dce8ff;\\n  color: var(--primary);\\n}\\n\\n.bubble {\\n  max-width: 75%;\\n  background: #f6f8fb;\\n  padding: 14px 16px;\\n  border-radius: 15px;\\n  font-size: 14px;\\n  line-height: 1.6;\\n}\\n\\n.message.user .bubble {\\n  background: var(--primary);\\n  color: white;\\n}\\n\\n.bubble strong {\\n  font-size: 12px;\\n}\\n\\n.warning {\\n  margin-top: 10px;\\n  padding: 9px;\\n  background: #fff7df;\\n  color: #806000;\\n  border-radius: 8px;\\n  font-size: 11px;\\n}\\n\\n\\n/* QUICK ACTIONS */\\n\\n.quick-actions {\\n  display: flex;\\n  gap: 8px;\\n  padding: 12px 20px;\\n  border-top: 1px solid var(--border);\\n  overflow-x: auto;\\n}\\n\\n.quick-actions button,\\n.suggestion {\\n  white-space: nowrap;\\n  border: 1px solid var(--border);\\n  background: white;\\n  padding: 9px 12px;\\n  border-radius: 20px;\\n  cursor: pointer;\\n  font-size: 11px;\\n}\\n\\n.quick-actions button:hover,\\n.suggestion:hover {\\n  border-color: var(--primary);\\n  color: var(--primary);\\n}\\n\\n\\n/* INPUT */\\n\\n.input-area {\\n  display: flex;\\n  gap: 10px;\\n  padding: 15px 20px;\\n  border-top: 1px solid var(--border);\\n  align-items: center;\\n}\\n\\n.input-area textarea {\\n  flex: 1;\\n  border: none;\\n  outline: none;\\n  resize: none;\\n  font-size: 14px;\\n  min-height: 40px;\\n  padding: 11px;\\n}\\n\\n.upload-btn {\\n  cursor: pointer;\\n  font-size: 20px;\\n}\\n\\n.send-btn {\\n  width: 43px;\\n  height: 43px;\\n  border: none;\\n  background: var(--primary);\\n  color: white;\\n  border-radius: 12px;\\n  cursor: pointer;\\n}\\n\\n#fileStatus {\\n  padding: 0 20px 10px;\\n  font-size: 11px;\\n  color: var(--muted);\\n}\\n\\n\\n/* RIGHT PANEL */\\n\\n.right-panel {\\n  display: flex;\\n  flex-direction: column;\\n  gap: 15px;\\n}\\n\\n.card,\\n.page-card {\\n  background: white;\\n  border: 1px solid var(--border);\\n  border-radius: 16px;\\n  padding: 20px;\\n}\\n\\n.card h3 {\\n  font-size: 14px;\\n  margin-bottom: 15px;\\n}\\n\\n.health-score {\\n  display: flex;\\n  align-items: center;\\n  gap: 12px;\\n}\\n\\n.score-circle {\\n  width: 65px;\\n  height: 65px;\\n  border-radius: 50%;\\n  background: #eaf3ff;\\n  color: var(--primary);\\n  display: flex;\\n  justify-content: center;\\n  align-items: center;\\n  font-size: 20px;\\n  font-weight: bold;\\n}\\n\\n.small {\\n  font-size: 11px;\\n  color: var(--muted);\\n  line-height: 1.5;\\n}\\n\\n.emergency-btn {\\n  width: 100%;\\n  border: none;\\n  background: #fff0f0;\\n  color: var(--danger);\\n  padding: 10px;\\n  border-radius: 9px;\\n  margin-top: 12px;\\n  cursor: pointer;\\n}\\n\\n.suggestion {\\n  width: 100%;\\n  margin-bottom: 8px;\\n  text-align: left;\\n}\\n\\n\\n/* PAGE */\\n\\n.page-card {\\n  max-width: 1100px;\\n  margin: auto;\\n}\\n\\n.page-card h2 {\\n  margin-bottom: 7px;\\n}\\n\\n.page-card \u003e p {\\n  color: var(--muted);\\n  font-size: 13px;\\n  margin-bottom: 25px;\\n}\\n\\n.section-heading {\\n  display: flex;\\n  align-items: center;\\n  justify-content: space-between;\\n}\\n\\n.primary-btn {\\n  background: var(--primary);\\n  color: white;\\n  padding: 11px 16px;\\n  border-radius: 9px;\\n  cursor: pointer;\\n  font-size: 12px;\\n}\\n\\n\\n/* REPORT */\\n\\n.report-result {\\n  border: 1px dashed #ccd5e3;\\n  border-radius: 14px;\\n  min-height: 280px;\\n  padding: 30px;\\n}\\n\\n.empty-state {\\n  text-align: center;\\n  color: var(--muted);\\n  padding: 50px 20px;\\n}\\n\\n.empty-state div {\\n  font-size: 40px;\\n}\\n\\n.empty-state h3 {\\n  color: var(--text);\\n  margin: 12px 0 5px;\\n}\\n\\n.report-table {\\n  width: 100%;\\n  border-collapse: collapse;\\n  margin-top: 20px;\\n}\\n\\n.report-table th,\\n.report-table td {\\n  padding: 12px;\\n  border-bottom: 1px solid var(--border);\\n  text-align: left;\\n  font-size: 12px;\\n}\\n\\n.report-table th {\\n  background: #f7f9fc;\\n}\\n\\n\\n/* DASHBOARD */\\n\\n.stats-grid {\\n  display: grid;\\n  grid-template-columns: repeat(4, 1fr);\\n  gap: 15px;\\n}\\n\\n.stat {\\n  padding: 18px;\\n  background: #f7f9fc;\\n  border-radius: 12px;\\n}\\n\\n.stat span {\\n  display: block;\\n  font-size: 11px;\\n  color: var(--muted);\\n  margin-bottom: 10px;\\n}\\n\\n.stat strong {\\n  font-size: 17px;\\n}\\n\\n.chart {\\n  margin-top: 30px;\\n}\\n\\n.bars {\\n  height: 220px;\\n  display: flex;\\n  align-items: end;\\n  gap: 20px;\\n  padding: 20px;\\n  background: #f7f9fc;\\n  border-radius: 12px;\\n  margin-top: 15px;\\n}\\n\\n.bars span {\\n  flex: 1;\\n  background: var(--primary);\\n  border-radius: 8px 8px 0 0;\\n}\\n\\n\\n/* MEDICATION */\\n\\n.medicine-form {\\n  display: flex;\\n  gap: 10px;\\n  margin-bottom: 20px;\\n}\\n\\n.medicine-form input {\\n  flex: 1;\\n  border: 1px solid var(--border);\\n  padding: 12px;\\n  border-radius: 9px;\\n  outline: none;\\n}\\n\\n.medicine-form button {\\n  border: none;\\n  background: var(--primary);\\n  color: white;\\n  padding: 0 20px;\\n  border-radius: 9px;\\n  cursor: pointer;\\n}\\n\\n.medicine {\\n  display: flex;\\n  justify-content: space-between;\\n  padding: 15px;\\n  background: #f7f9fc;\\n  border-radius: 10px;\\n  margin-bottom: 8px;\\n}\\n\\n.medicine-warning {\\n  margin-top: 20px;\\n  padding: 15px;\\n  background: #fff7df;\\n  border-radius: 10px;\\n  color: #806000;\\n  font-size: 12px;\\n}\\n\\n\\n/* MOOD */\\n\\n.moods {\\n  display: flex;\\n  gap: 15px;\\n}\\n\\n.moods button {\\n  width: 60px;\\n  height: 60px;\\n  border: 1px solid var(--border);\\n  background: white;\\n  border-radius: 15px;\\n  font-size: 25px;\\n  cursor: pointer;\\n}\\n\\n.selected-mood {\\n  margin-top: 25px;\\n  padding: 15px;\\n  background: #f7f9fc;\\n  border-radius: 10px;\\n}\\n\\n\\n/* MOBILE */\\n\\n@media (max-width: 850px) {\\n\\n  .sidebar {\\n    width: 70px;\\n    padding: 15px 8px;\\n  }\\n\\n  .logo div:not(.logo-icon),\\n  .new-chat,\\n  .nav-item span,\\n  .privacy {\\n    display: none;\\n  }\\n\\n  .logo {\\n    justify-content: center;\\n  }\\n\\n  .nav-item {\\n    text-align: center;\\n    font-size: 20px;\\n  }\\n\\n  .chat-layout {\\n    grid-template-columns: 1fr;\\n  }\\n\\n  .right-panel {\\n    display: none;\\n  }\\n\\n  .stats-grid {\\n    grid-template-columns: 1fr 1fr;\\n  }\\n\\n}\\n\\n@media (max-width: 600px) {\\n\\n  .topbar {\\n    padding: 0 15px;\\n  }\\n\\n  .section {\\n    padding: 12px;\\n  }\\n\\n  .messages {\\n    padding: 15px;\\n  }\\n\\n  .bubble {\\n    max-width: 88%;\\n  }\\n\\n  .stats-grid {\\n    grid-template-columns: 1fr;\\n  }\\n\\n  .section-heading {\\n    flex-direction: column;\\n    align-items: flex-start;\\n    gap: 15px;\\n  }\\n\\n  .medicine-form {\\n    flex-direction: column;\\n  }\\n\\n  .medicine-form button {\\n    padding: 12px;\\n  }\\n\\n}\\n```\\n\\n### 3. `script.js`\\n\\n```javascript\\nconst messages = document.getElementById(\\\"messages\\\");\\nconst input = document.getElementById(\\\"userInput\\\");\\n\\n\\n/* =========================\\n   SECTION NAVIGATION\\n========================= */\\n\\nfunction showSection(id) {\\n\\n  document.querySelectorAll(\\\".section\\\").forEach(section =\u003e {\\n    section.classList.remove(\\\"active\\\");\\n  });\\n\\n  document.getElementById(id).classList.add(\\\"active\\\");\\n\\n  document.querySelectorAll(\\\".nav-item\\\").forEach(btn =\u003e {\\n    btn.classList.remove(\\\"active\\\");\\n  });\\n\\n  const titles = {\\n    chat: [\\\"AI Health Assistant\\\", \\\"Tell me what you're experiencing.\\\"],\\n    reports: [\\\"Health Report Analyzer\\\", \\\"Understand your health reports.\\\"],\\n    dashboard: [\\\"Health Dashboard\\\", \\\"Your tracked health information.\\\"],\\n    medications: [\\\"Medication Tracker\\\", \\\"Track medicines prescribed by your clinician.\\\"],\\n    mood: [\\\"Mood \u0026 Symptoms\\\", \\\"Track how you feel over time.\\\"]\\n  };\\n\\n  document.getElementById(\\\"pageTitle\\\").textContent = titles[id][0];\\n  document.getElementById(\\\"pageSubtitle\\\").textContent = titles[id][1];\\n}\\n\\n\\n/* =========================\\n   CHAT\\n========================= */\\n\\nfunction sendMessage() {\\n\\n  const text = input.value.trim();\\n\\n  if (!text) return;\\n\\n  addUserMessage(text);\\n\\n  input.value = \\\"\\\";\\n\\n  showTyping();\\n\\n  setTimeout(() =\u003e {\\n\\n    removeTyping();\\n\\n    const response = generateHealthResponse(text);\\n\\n    addAIMessage(response);\\n\\n  }, 800);\\n}\\n\\n\\nfunction quickMessage(text) {\\n\\n  input.value = text;\\n\\n  sendMessage();\\n}\\n\\n\\nfunction handleEnter(event) {\\n\\n  if (event.key === \\\"Enter\\\" \u0026\u0026 !event.shiftKey) {\\n\\n    event.preventDefault();\\n\\n    sendMessage();\\n  }\\n}\\n\\n\\nfunction addUserMessage(text) {\\n\\n  const div = document.createElement(\\\"div\\\");\\n\\n  div.className = \\\"message user\\\";\\n\\n  div.innerHTML = `\\n    \u003cdiv class=\\\"avatar\\\"\u003e👤\u003c/div\u003e\\n\\n    \u003cdiv class=\\\"bubble\\\"\u003e\\n      ${escapeHTML(text)}\\n    \u003c/div\u003e\\n  `;\\n\\n  messages.appendChild(div);\\n\\n  scrollChat();\\n}\\n\\n\\nfunction addAIMessage(text) {\\n\\n  const div = document.createElement(\\\"div\\\");\\n\\n  div.className = \\\"message ai\\\";\\n\\n  div.innerHTML = `\\n    \u003cdiv class=\\\"avatar\\\"\u003e✚\u003c/div\u003e\\n\\n    \u003cdiv class=\\\"bubble\\\"\u003e\\n\\n      \u003cstrong\u003eMediMind AI\u003c/strong\u003e\\n\\n      \u003cp\u003e${text}\u003c/p\u003e\\n\\n    \u003c/div\u003e\\n  `;\\n\\n  messages.appendChild(div);\\n\\n  scrollChat();\\n}\\n\\n\\nfunction showTyping() {\\n\\n  const div = document.createElement(\\\"div\\\");\\n\\n  div.id = \\\"typing\\\";\\n\\n  div.className = \\\"message ai\\\";\\n\\n  div.innerHTML = `\\n    \u003cdiv class=\\\"avatar\\\"\u003e✚\u003c/div\u003e\\n    \u003cdiv class=\\\"bubble\\\"\u003eThinking...\u003c/div\u003e\\n  `;\\n\\n  messages.appendChild(div);\\n\\n  scrollChat();\\n}\\n\\n\\nfunction removeTyping() {\\n\\n  const typing = document.getElementById(\\\"typing\\\");\\n\\n  if (typing) typing.remove();\\n}\\n\\n\\nfunction scrollChat() {\\n\\n  messages.scrollTop = messages.scrollHeight;\\n}\\n\\n\\n/* =========================\\n   BASIC HEALTH RESPONSE\\n   DEMO ONLY\\n========================= */\\n\\nfunction generateHealthResponse(text) {\\n\\n  const message = text.toLowerCase();\\n\\n\\n  /* Emergency keywords */\\n\\n  const emergencyWords = [\\n    \\\"chest pain\\\",\\n    \\\"difficulty breathing\\\",\\n    \\\"can't breathe\\\",\\n    \\\"severe bleeding\\\",\\n    \\\"unconscious\\\",\\n    \\\"fainted\\\",\\n    \\\"seizure\\\"\\n  ];\\n\\n  if (emergencyWords.some(word =\u003e message.includes(word))) {\\n\\n    return `\\n      \u003cstrong\u003e🚨 Please seek urgent medical help.\u003c/strong\u003e\\n\\n      \u003cbr\u003e\u003cbr\u003e\\n\\n      The symptom you mentioned can sometimes require\\n      immediate assessment.\\n\\n      \u003cbr\u003e\u003cbr\u003e\\n\\n      If this is happening now or is severe, contact your\\n      local emergency service or get help from a trusted adult/person nearby.\\n\\n      \u003cbr\u003e\u003cbr\u003e\\n\\n      I can't safely diagnose the cause through chat.\\n    `;\\n  }\\n\\n\\n  /* Emotional support */\\n\\n  const emotionalWords = [\\n    \\\"sad\\\",\\n    \\\"anxious\\\",\\n    \\\"anxiety\\\",\\n    \\\"worried\\\",\\n    \\\"stress\\\",\\n    \\\"depressed\\\",\\n    \\\"scared\\\",\\n    \\\"lonely\\\"\\n  ];\\n\\n  if (emotionalWords.some(word =\u003e message.includes(word))) {\\n\\n    return `\\n      It sounds like you're having a difficult moment. ❤️\\n\\n      \u003cbr\u003e\u003cbr\u003e\\n\\n      You don't have to figure everything out at once.\\n      If you want, tell me what has been worrying you,\\n      and I can help you organize what you're experiencing.\\n\\n      \u003cbr\u003e\u003cbr\u003e\\n\\n      If you feel unsafe or think you might hurt yourself,\\n      please tell a trusted adult or seek immediate professional help.\\n    `;\\n  }\\n\\n\\n  /* Fever */\\n\\n  if (message.includes(\\\"fever\\\") ||\\n      message.includes(\\\"temperature\\\")) {\\n\\n    return `\\n      Fever can happen with infections and several other conditions.\\n\\n      \u003cbr\u003e\u003cbr\u003e\\n\\n      Please consider telling me:\\n      \u003cbr\u003e\\n      • your temperature\\n      \u003cbr\u003e\\n      • how long you've had it\\n      \u003cbr\u003e\\n      • other symptoms\\n      \u003cbr\u003e\\n      • your age\\n\\n      \u003cbr\u003e\u003cbr\u003e\\n\\n      I can help you understand the information,\\n      but I won't prescribe medication.\\n    `;\\n  }\\n\\n\\n  /* Pain */\\n\\n  if (\\n    message.includes(\\\"pain\\\") ||\\n    message.includes(\\\"headache\\\") ||\\n    message.includes(\\\"stomach\\\")\\n  ) {\\n\\n    return `\\n      I can help you organize the symptoms.\\n\\n      \u003cbr\u003e\u003cbr\u003e\\n\\n      Please describe:\\n      \u003cbr\u003e\\n      • where the pain is\\n      \u003cbr\u003e\\n      • when it started\\n      \u003cbr\u003e\\n      • how severe it feels\\n      \u003cbr\u003e\\n      • whether it is getting better or worse\\n      \u003cbr\u003e\\n      • any other symptoms\\n\\n      \u003cbr\u003e\u003cbr\u003e\\n\\n      If the pain is severe, sudden or associated with\\n      emergency symptoms, seek urgent medical care.\\n    `;\\n  }\\n\\n\\n  /* Default */\\n\\n  return `\\n    Thanks for telling me.\\n\\n    \u003cbr\u003e\u003cbr\u003e\\n\\n    I can help you understand your symptoms,\\n    organize your health information, and identify\\n    questions to discuss with a healthcare professional.\\n\\n    \u003cbr\u003e\u003cbr\u003e\\n\\n    You can also upload a health report using the 📎 button.\\n\\n    \u003cbr\u003e\u003cbr\u003e\\n\\n    \u003cstrong\u003eWhat I won't do:\u003c/strong\u003e\\n    independently diagnose a disease or prescribe a medicine.\\n  `;\\n}\\n\\n\\n/* ==================
